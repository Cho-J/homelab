arch: amd64
cores: 1
features: nesting=1
hostname: bifrost
memory: 512
nameserver: 192.0.2.57 1.1.1.1
net0: name=eth0,bridge=vmbr0,firewall=1,gw=192.0.2.254,hwaddr=02:00:00:00:00:00,ip=192.0.2.58/24,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-101-disk-0,size=4G
startup: order=2
swap: 512
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
