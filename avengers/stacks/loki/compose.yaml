services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - 8081:8080
    volumes:
      - ./data:/usr/share/tessdata
      - ./configs:/configs
    environment:
      - DOCKER_ENABLE_SECURITY=true
      - LANGS=fr_FR
