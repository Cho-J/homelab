services:
  freshrss:
    image: freshrss/freshrss:latest
    container_name: karen
    restart: unless-stopped
    ports:
      - 8084:80
    volumes:
      - ./data:/var/www/FreshRSS/data
      - ./extensions:/var/www/FreshRSS/extensions
    environment:
      - TZ=Europe/Paris
      - CRON_MIN=*/30
